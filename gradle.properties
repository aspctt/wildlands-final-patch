# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Left off deliberately. Launching the game from an IDE goes through an init script IntelliJ
# generates for BootstrapLauncher, and that script registers a build listener and touches
# Task.project at execution time, both of which the configuration cache rejects outright:
#
#   Listener registration 'Gradle.addListener' by build is unsupported
#
# The MDK ships with it on, which is fine for a mod nobody launches from an IDE. Turning it on
# again means every game launch has to come from the command line.
org.gradle.configuration-cache=false

# Parchment mappings, for readable parameter names on vanilla methods.
# Latest versions: https://parchmentmc.org/docs/getting-started
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

## Environment Properties

# Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties

# Must be lowercase in English locale, matching the regex [a-z][a-z0-9_]{1,63}.
# Must match the MODID constant in WildlandsFinalPatch.
mod_id=wildlands_patch
mod_name=Wildlands Final Patch
mod_license=All Rights Reserved
mod_version=1.0.0
# File name of the built JAR, before the version is appended. Unlike mod_id this is only cosmetic,
# so it is written the way the mod is named rather than in the id's lowercase form.
mod_archives_name=WildlandsPatch
mod_authors=aspctt
# Must match the base package used for the mod sources.
mod_group_id=com.aspctt.wildlandspatch

## Mods this patch compiles against
# All are compileOnly: they are present in the pack anyway, and none of them is a hard requirement.

# Sodium's public API, published separately from the mod itself, so the config API can be used
# without unpacking Sodium's nested JAR.
sodium_api_version=0.8.13+mc1.21.1

# Better Biome Reblend, pinned by Modrinth version id rather than version number. Two different
# files are published as "1.5.2" and only this one carries the neoforge class tree; asking for the
# number resolves the other one.
better_biome_reblend_version=HZlLCOct

# Cubes Without Borders, Modrinth version number.
cubes_without_borders_version=3.0.0+1.21

# Serene Seasons, pinned by Modrinth version id because the same version number is published for
# Fabric, Forge and NeoForge, and only one of those is the right jar.
serene_seasons_version=pHEgQQUE

## Development

# Where installDevMods reads the pack's JARs from. Defaults to external-files/dev-mods.
# Point it straight at the Prism instance to test against the live pack, and keep the machine
# specific path out of the repository by setting it in ~/.gradle/gradle.properties or on the
# command line with -Pdev_mods_dir=... instead of here.
#dev_mods_dir=C:/Users/araltan/AppData/Roaming/PrismLauncher/instances/Wildlands/minecraft/mods
