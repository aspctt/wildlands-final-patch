plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Maven repositories for the mods this patch compiles against go here, as they are needed.
    // Common ones:
    // maven { url = 'https://maven.blamejared.com' }          // JEI, CraftTweaker
    // maven { url = 'https://cursemaven.com' }                // any CurseForge file by project/file id
    // maven { url = 'https://api.modrinth.com/maven' }        // any Modrinth version
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Uncomment when a fix needs access to something private in vanilla or NeoForge.
// Prefer an access transformer over a mixin for pure visibility changes: it is cheaper and cannot conflict.
//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/removed as needed, separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console.
        // Read more: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }

    data {
        // Data generation, for the odd compatibility recipe or tag override this patch has to ship.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// Use it instead of 'runtimeOnly' for dependencies that should be present when testing
// but that must not be published as a requirement of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Mods this patch mixes into or compiles against.
    //
    // A mixin only needs the target class at compile time, so 'compileOnly' is usually right:
    // the patched mod is present in the pack anyway and must not become a hard requirement here.
    // Guard every such fix behind a mod-loaded check so the JAR stays safe when the mod is absent.
    //
    // From a Maven repository declared above:
    // compileOnly "some.group:some-mod:${some_mod_version}"
    //
    // From a jar dropped in external-files/dev-mods, which is also what the development client loads:
    // compileOnly files("external-files/dev-mods/some-mod-1.21.1-1.2.3.jar")
}

// Mirrors the modpack JARs kept in external-files/dev-mods into the development client's mods
// folder, so fixes run against the mods they are meant to fix. It is a Sync, not a Copy: jars
// removed from the source folder are removed from the run folder too, which is what stops a
// stale duplicate of an updated mod from being loaded alongside the new one.
tasks.register('installDevMods', Sync) {
    group = 'wildlands'
    description = 'Copies the mod JARs in external-files/dev-mods into run/client/mods.'

    from(layout.projectDirectory.dir('external-files/dev-mods')) {
        include '**/*.jar'
    }
    into(layout.projectDirectory.dir('run/client/mods'))
}

// NeoGradle registers the run tasks late, so match by name rather than looking them up.
// Note this only covers Gradle-launched runs; an IDE run configuration calls the game directly,
// so run installDevMods yourself after changing the dev mods folder.
tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn 'installDevMods'
}

// Expands the declared properties in the specified resource targets.
// A missing property is an error. Properties are expanded using ${} Groovy notation.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
